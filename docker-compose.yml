services:
  frontend:
    container_name: vue-movies
    build:
      context: ./vue-movies
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - node_modules:/app/node_modules
    environment:
      - NODE_OPTIONS=--max_old_space_size=2048  # Tăng lên 2GB cho Vue
      - NODE_ENV=production
      - NUXT_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
      - NUXT_HOST=0.0.0.0
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
    dns:
      - 8.8.8.8
      - 1.1.1.1
    user: "node"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cinema-network
    deploy:
      resources:
        limits:
          cpus: "0.5"  # Tăng CPU cho xử lý giao diện
          memory: "1024M"  # Tăng memory để xử lý request lớn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    container_name: cinema-system
    build:
      context: ./cinema-system
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/cinema_db?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=crystal2001
      - SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE=UTC
      - SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_BATCH_VERSIONED_DATA=true
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_MAIL_USERNAME=${SMTP_USERNAME}
      - SPRING_MAIL_PASSWORD=${SMTP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update  # Tự động cập nhật schema
    depends_on:
      mysql-db:
        condition: service_healthy
      recommendation-api:
        condition: service_started
    volumes:
      - ./cinema-system:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - cinema-network
    deploy:
      resources:
        limits:
          cpus: "0.8"  # Tăng CPU cho xử lý logic backend
          memory: "1024M"  # Tăng memory để xử lý request và caching
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql-db:
    image: mysql:8.0
    container_name: cinema-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=crystal2001
      - MYSQL_DATABASE=cinema_db
      - MYSQL_MAX_CONNECTIONS=200  # Tăng số kết nối tối đa
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"  # Tăng CPU cho MySQL
          memory: "1024M"  # Tăng memory để cải thiện hiệu suất
    command: --innodb_buffer_pool_size=512M  # Tối ưu cache MySQL
    restart: unless-stopped

  recommendation-api:
    build:
      context: ./recommendation-api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./recommendation-api:/app
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=crystal2001
      - MYSQL_DATABASE=cinema_db
      - API_KEY=770653f0e946b9c775be9a0439b1c4aa
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - cinema-network
    deploy:
      resources:
        limits:
          cpus: "0.4"  # Tăng CPU cho xử lý khuyến nghị
          memory: "512M"  # Tăng memory cho xử lý dữ liệu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:6
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf  # Sử dụng config tùy chỉnh
    networks:
      - cinema-network
    deploy:
      resources:
        limits:
          cpus: "0.3"  # Tăng CPU nhẹ
          memory: "512M"  # Tăng memory cho caching
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin-panel-backend:
    container_name: admin-panel-backend
    build:
      context: ./admin-panel-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/cinema_db?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=crystal2001
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - spring.datasource.hikari.maximum-pool-size=10  # Tăng pool size
      - spring.datasource.hikari.minimum-idle=3
      - spring.datasource.hikari.connection-timeout=20000
      - spring.datasource.hikari.idle-timeout=300000
      - spring.datasource.hikari.max-lifetime=1800000
      - spring.devtools.livereload.enabled=false
      - spring.devtools.restart.enabled=false
      - SERVER_PORT=8081
      - SERVER_SERVLET_CONTEXT_PATH=/
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"  # Tăng CPU
          memory: "1024M"  # Tăng memory
    networks:
      - cinema-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-panel-frontend:
    container_name: admin-panel-frontend
    build:
      context: ./admin-panel-frontend
      dockerfile: Dockerfile
      args:
        - VUE_APP_API_URL=/api
    ports:
      - "8082:80"
    environment:
      - NODE_ENV=production
      - VUE_APP_API_URL=/api
    depends_on:
      - admin-panel-backend
    networks:
      - cinema-network
    deploy:
      resources:
        limits:
          cpus: "0.4"  # Tăng CPU
          memory: "512M"  # Tăng memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cinema-network:
    driver: bridge
    name: cinema-network
    attachable: true

volumes:
  mysql_data:
  node_modules:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/finalproject/redis-data
