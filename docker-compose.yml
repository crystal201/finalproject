  mysql-db:
    image: mysql:8.0
    container_name: cinema-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=crystal2001
      - MYSQL_DATABASE=cinema_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"
    restart: unless-stopped

