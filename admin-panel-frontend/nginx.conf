server {
    listen 8082; # Giữ port 8082
    server_name 157.66.219.181;

    # Phục vụ frontend
    location / {
        root /usr/share/nginx/html; # Thư mục build của admin-panel-frontend
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Hỗ trợ SPA
    }

    # Proxy tất cả yêu cầu tới /admin/ đến backend
    location /admin/ {
        proxy_pass http://admin-panel-backend:8081/; # Trỏ tới backend trên port 8081
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy tất cả yêu cầu tới /api/ (nếu cần)
    location /api/ {
        proxy_pass http://admin-panel-backend:8081/admin/; # Đảm bảo khớp với context path
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback cho 404
    error_page 404 /index.html;
}